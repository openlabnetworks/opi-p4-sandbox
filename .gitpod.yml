# ============================================================
# Gitpod Configuration for OPI & P4 Sandbox
# ============================================================
# Enables one-click launch of the full sandbox in Gitpod.
# ============================================================

image:
  file: .devcontainer/Dockerfile

tasks:
  - name: Setup & Start Sandbox
    init: |
      echo "🔧 Installing development tools..."
      make install-tools
    command: |
      echo "🚀 Starting OPI & P4 Sandbox..."
      make start-sandbox
      echo ""
      echo "✅ Sandbox is ready!"
      echo "   OPI API: http://localhost:8080"
      echo ""
      echo "Try: curl http://localhost:8080/v1/ports | python3 -m json.tool"

  - name: Documentation
    command: |
      echo "📚 OPI & P4 Sandbox — Developer Guide"
      echo "════════════════════════════════════════"
      echo ""
      echo "Quick Commands:"
      echo "  make status        — Check sandbox health"
      echo "  make smoke-test    — Run all tests"
      echo "  make logs          — View container logs"
      echo "  make stop-sandbox  — Stop everything"
      echo ""
      echo "API Endpoints:"
      echo "  GET  http://localhost:8080/healthz"
      echo "  GET  http://localhost:8080/v1/ports"
      echo "  POST http://localhost:8080/v1/ports"
      echo "  GET  http://localhost:8080/v1/pipelines"
      echo "  POST http://localhost:8080/v1/pipelines"

ports:
  - port: 8080
    visibility: public
    name: OPI API Server
    onOpen: notify
  - port: 9559
    visibility: public
    name: P4 BMv2 P4Runtime
    onOpen: ignore
  - port: 9090
    visibility: public
    name: P4 BMv2 Thrift
    onOpen: ignore

vscode:
  extensions:
    - golang.go
    - ms-vscode.makefile-tools
    - ms-azuretools.vscode-docker
    - redhat.vscode-yaml
